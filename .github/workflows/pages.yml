name: Web configurator

# Publishes web/ on GitHub Pages, with the Python files it runs in the
# browser (python/lib), the demo and the templates beside it, and the
# simulated pedal: the firmware built for WebAssembly (firmware/sim). Skipped until
# Pages is switched on for the repository, with GitHub Actions as its source.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "python/lib/**"
      - "python/demo-all-features.csv"
      - "python/templates/**"
      - "firmware/Core/**"
      - "firmware/USB_DEVICE/App/**"
      - "firmware/Middlewares/stm32-ssd1306-master/**"
      - "firmware/sim/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.has_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Put the site together
        run: |
          mkdir -p site/lib site/templates
          cp web/*.html web/*.js web/*.css site/
          cp python/lib/*.py site/lib/
          cp python/demo-all-features.csv site/
          cp python/templates/*.csv site/templates/

      - name: Build the simulated pedal
        run: |
          sudo apt-get install -y clang lld
          sh firmware/sim/build.sh site/pedal-sim.wasm

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

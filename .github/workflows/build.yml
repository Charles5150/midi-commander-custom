name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Firmware (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build debug image
        run: pio run -e midi_debug

      - name: Build DFU image
        run: pio run -e midi_dfu

      - name: Upload DFU artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-dfu
          path: |
            artifacts/dfu/platformio-latest.dfu
            .pio/build/midi_dfu/firmware.bin
          if-no-files-found: error

  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # python-rtmidi needs ALSA headers on Linux; customtkinter needs tk
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev python3-tk
          pip install -r python/requirements.txt pytest pytest-xdist

      - name: Run tests
        # The unittest suite, spread over the runner's cores
        run: python -m pytest -n auto -q python/tests

      - name: Build the simulated pedal
        # The firmware's own sources for WebAssembly: clang and wasm-ld
        run: |
          sudo apt-get install -y clang lld
          sh firmware/sim/build.sh

      - name: Run the simulated pedal's tests
        run: node --test web/tests/*.test.mjs
        env:
          PYTHON: python

      - name: Import check for the tools
        run: |
          cd python
          python -c "import lib.configPacker, lib.binaryUnpacker, lib.midiDevice, lib.configCsv"
          python CSV_to_Flash.py --help
          python Flash_to_CSV.py --help

  gui:
    name: Configurator window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev python3-tk xvfb
          pip install -r python/requirements.txt

      - name: The configurator's window
        # Opened on a virtual display: every tab, and each CSV saved as loaded
        run: GUI_TEST=1 xvfb-run -a python -m unittest python/tests/test_gui.py -v

  install:
    # What a user does on each system: the launcher sets up .venv, then the tests run in it
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call "Start Configurator.bat" --check

      - name: Launcher (macOS and Linux)
        if: runner.os != 'Windows'
        run: ./start-configurator.sh --check

      - name: The tools run in the environment it made
        # The whole suite runs in the Python tools job: here, that the tools
        # import and pack a configuration on each system
        shell: bash
        run: |
          if [ -x .venv/Scripts/python.exe ]; then PY=$PWD/.venv/Scripts/python.exe; else PY=$PWD/.venv/bin/python; fi
          cd python
          "$PY" -c "import lib.configPacker, lib.binaryUnpacker, lib.midiDevice, lib.configCsv"
          "$PY" CSV_to_Flash.py --help > /dev/null
          "$PY" -m unittest tests.test_generators tests.test_buttons

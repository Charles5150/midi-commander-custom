<text x="665.0" y="525" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9a9aa0" text-anchor="middle">USB_MIDI_Thru · RealTime_Passthrough: el resto, hacia la salida DIN</text>
<text x="610.0" y="606" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#9a9aa0" text-anchor="middle">La pedalera no tiene toma MIDI IN: solo entra lo que llega por USB.</text>

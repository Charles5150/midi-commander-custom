<text x="970.0" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#30d158" text-anchor="middle">el mismo MIDI</text>
<text x="970.0" y="232" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#9a9aa0" text-anchor="middle">MIDI OUT (DIN)</text>
